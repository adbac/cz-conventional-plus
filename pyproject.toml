[project]
name = "cz_conventional_plus"
description = "A commitizen plugin subclassing 'cz_conventional_commits', adding 'chore' and 'revert' commit types."
authors = [{ name = "Adrien Bachelart", email = "hello@adrienbc.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = ["commitizen (>=4.10.0,<5.0.0)"]
version = "1.0.3"

[project.urls]
Homepage = "https://github.com/adbac/cz-conventional-plus"
Issues = "https://github.com/adbac/cz-conventional-plus/issues"

[build-system]
requires = ["uv_build>=0.9.18,<0.13.0"]
build-backend = "uv_build"

[project.entry-points."commitizen.plugin"]
cz_conventional_plus = "cz_conventional_plus:ConventionalPlusCz"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''[Ff]irst [Cc]ommit.*''',
    '''[Ii]nitial [Cc]ommit.*''',
]

[tool.commitizen]
name = "cz_conventional_plus"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
major_version_zero = true